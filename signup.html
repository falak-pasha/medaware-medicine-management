
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | MEDAWARE</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages/signup.css">
</head>
<body>
  <main class="signup-card">
    <div class="brand">✚ MEDAWARE</div>
    <h1>Create your account</h1>
    <p class="subtitle">
      Your personal medicine companion starts here.
      Create an account to manage your medicines and reminders.
    </p>

    <form id="signupForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName"
          type="text" placeholder="Enter your full name"
          autocomplete="name" required>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email"
          type="email" placeholder="you@example.com"
          autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password"
          type="password" placeholder="At least 8 characters"
          autocomplete="new-password" minlength="8" required>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" name="confirmPassword"
          type="password" placeholder="Enter your password again"
          autocomplete="new-password" minlength="8" required>
      </div>

      <div id="signupCaptcha" class="captcha-box" hidden></div>

      <button class="signup-button" id="signupButton" type="submit">
        Create Account
      </button>

      <p id="message" role="status" aria-live="polite"></p>
      <p class="legal-note">
        By creating an account you agree to the <a href="privacy.html">privacy and terms</a>.
        MEDAWARE is not medical advice.
      </p>
    </form>

    <p class="login-link">
      Already have an account?
      <a href="index.html">Log in</a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/shared/captcha.js"></script>
  <script src="js/pages/signup.js"></script>
</body>
</html>
